<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #forgot-password-form-container {
            width: 400px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group input {
            background-color: #ececec;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .alert-danger, .alert-success {
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #007bff !important;
            border-color: #007bff !important;
            color: #fff;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="title">Forgot Password</h2>
        <div id="forgot-password-form-container">
            <form method="post">
                {% csrf_token %}
             
                <div class="form-group">
                    <label for="id_email">Email Address</label>
                    <input type="email" class="form-control" id="id_email" name="email" placeholder="Enter your registered email" required>
                </div>
                
                {% if messages %}
                <div class="alert alert-danger">
                    {% for message in messages %}
                    {{ message }}
                    {% endfor %}
                </div>
                {% endif %}
                   
                <button type="submit" class="btn btn-primary">Send OTP</button>
            </form>
        </div>
        
        <p class="mt-3 text-center"><a href="{% url 'user_login' %}" class="btn btn-secondary">Back to Login</a></p>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
